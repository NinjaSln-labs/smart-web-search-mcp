name: Publish to PyPI

on:
  push:
    tags: ['v*']
  workflow_dispatch: # 手动触发只发 TestPyPI（灰度验证发布链路）

# 最小化权限：工作流级清零，id-token: write 仅授予 publish job（PyPA 推荐，
# repo-audit SEC-004 v1.3.0 起支持 job 级 fallback 检测）
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: 版本守卫（tag ↔ pyproject.toml 静态版本）
        if: github.event_name == 'push'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PY_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "$TAG_VERSION" = "$PY_VERSION" || { echo "✗ tag v$TAG_VERSION != pyproject $PY_VERSION"; exit 1; }
          echo "✓ 版本一致: $PY_VERSION"
      - name: Build
        run: pip install build twine && python -m build && twine check dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  # 灰度：TestPyPI 验证发布链路（workflow_dispatch 手动触发）
  publish-testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write # Trusted Publishing（OIDC）
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc # v1.12.4
        with:
          repository-url: https://test.pypi.org/legacy/

  # 正式：PyPI（tag push 触发）
  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # Trusted Publishing（OIDC）
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc # v1.12.4
